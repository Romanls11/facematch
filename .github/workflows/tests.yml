name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_pgsql, gd, fileinfo, intl, zip
          coverage: none

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependencias de npm y build de assets
        run: |
          npm ci
          npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Pruebas unitarias y de feature
        run: php artisan test

      - name: Pruebas de integración (motor facial real)
        run: php artisan test --group=integration
        env:
          FACE_NODE_BINARY: node
